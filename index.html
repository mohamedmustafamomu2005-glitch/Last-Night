const T=32,GW=32,GH=22,$=id=>document.getElementById(id);

MAP.forEach((r,y)=>[...r].forEach((c,x)=>{if("KBO".includes(c))items.push({t:c,x,y});if(c=="D"){dIdx[y*GW+x]=doors.length;doors.push({x,y})}if(c=="S")spawn={x,y};if(c=="M")mst={x,y};if(c=="E")exitC={x,y}}));

resetWorld(0);
function solidT(x,y){if(x<0||y<0||x>=GW||y>=GH)return 1;const c=MAP[y][x];if(c=="#"||c=="X")return 1;if(c=="D")return W.dr[dIdx[y*GW+x]]!="1"?1:0;return 0}

function los(a,b,c,d){const n=Math.ceil(Math.hypot(c-a,d-b)/8);for(let i=1;i<n;i++)if(solidPx(a+(c-a)*i/n,b+(d-b)*i/n))return false;return true}

let buf={},aStat={},act=[];
function loadAudio(){for(const k in AUD){aStat[k]="loading";try{const bin=atob(AUD[k]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);

/* plays a real clip through the SFX bus; steals (fades) earlier clips unless layer:1; returns false when the clip is unavailable so callers fall back to synth */
